version: '3.8'
services:
  ai-microservice:
    build: .
    ports:
      - "5000:5000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", 
             "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
